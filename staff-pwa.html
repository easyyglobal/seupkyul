<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>세없결 직원 출퇴근</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="세없결 출퇴근">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal: #1A1A1A;
  --ok:   #4A9A6A;
  --err:  #C45252;
  --warn: #C8922A;
  --bg:   #F8F8F5;
}
body {
  font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
.header {
  background: #1A1A1A;
  color: white;
  padding: 20px 20px 16px;
  text-align: center;
}
.header-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.6; margin-bottom: 4px; }
.header-title { font-size: 20px; font-weight: 800; }
.header-date { font-size: 12px; opacity: 0.5; margin-top: 4px; }

.content { flex: 1; padding: 20px 16px; max-width: 480px; margin: 0 auto; width: 100%; }

.card {
  background: white;
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  margin-bottom: 16px;
}
.card-title { font-size: 12px; font-weight: 700; color: #999; letter-spacing: 0.05em; margin-bottom: 14px; text-transform: uppercase; }

/* 로그인 폼 */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; height: 48px; border: 1.5px solid #e5e5e5;
  border-radius: 12px; padding: 0 16px;
  font-size: 15px; font-family: inherit; outline: none;
  transition: border-color .2s;
}
.form-input:focus { border-color: #1A1A1A; }
select.form-input { cursor: pointer; background: white; }

/* 버튼 */
.btn-primary {
  width: 100%; height: 54px;
  background: #1A1A1A; color: white;
  border: none; border-radius: 14px;
  font-size: 16px; font-weight: 800;
  font-family: inherit; cursor: pointer;
  transition: background .2s, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary.out {
  background: linear-gradient(135deg, #C45252, #E07070);
}
.btn-primary.disabled {
  background: #ccc; cursor: not-allowed;
}
.btn-secondary {
  width: 100%; height: 44px;
  background: transparent; color: #555;
  border: 1.5px solid #e5e5e5; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; margin-top: 10px;
}

/* 상태 표시 */
.status-panel {
  background: linear-gradient(135deg, #1A1A1A, #3A3A3A);
  border-radius: 20px;
  padding: 28px 24px;
  color: white;
  margin-bottom: 16px;
  text-align: center;
}
.status-emoji { font-size: 48px; margin-bottom: 12px; }
.status-name { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.status-branch { font-size: 13px; opacity: 0.6; margin-bottom: 16px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: 100px; font-size: 14px; font-weight: 700;
}
.status-badge.in  { background: rgba(74,154,106,0.2); color: #6FCF97; }
.status-badge.out { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
.status-badge.none { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }

.time-row {
  display: flex; justify-content: center; gap: 32px;
  margin-top: 16px; padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.time-item { text-align: center; }
.time-label { font-size: 10px; opacity: 0.5; letter-spacing: 0.1em; margin-bottom: 4px; }
.time-val { font-size: 20px; font-weight: 800; }
.time-val.empty { opacity: 0.3; }

/* 이력 카드 */
.hist-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.hist-item:last-child { border-bottom: none; }
.hist-date { font-size: 12px; color: #aaa; }
.hist-times { font-size: 13px; font-weight: 700; color: #333; }
.hist-hours { font-size: 12px; color: var(--teal); font-weight: 700; }

/* 시계 */
.live-clock {
  font-size: 40px; font-weight: 800; color: #1A1A1A;
  text-align: center; letter-spacing: -1px; margin-bottom: 4px;
}
.live-date-str { font-size: 13px; color: #aaa; text-align: center; margin-bottom: 20px; }

/* 토스트 */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1A1A1A; color: white; padding: 12px 24px;
  border-radius: 100px; font-size: 14px; font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
  opacity: 0; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

#screen-login, #screen-main { display: none; }
#screen-login.active, #screen-main.active { display: block; }
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">SEUPKYUL</div>
  <div class="header-title">직원 출퇴근 관리</div>
  <div class="header-date" id="headerDate"></div>
</div>

<div class="content">
  <!-- 로그인 화면 -->
  <div id="screen-login">
    <div class="card" style="margin-top:8px;">
      <div class="card-title">직원 로그인</div>
      <div class="live-clock" id="loginClock">00:00:00</div>
      <div class="live-date-str" id="loginDateStr"></div>
      <div class="form-group">
        <label class="form-label">지점</label>
        <select class="form-input" id="loginBranch">
          <option>강남점</option>
          <option>홍대점</option>
          <option>분당점</option>
          <option>신촌점</option>
          <option>잠실점</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">이름</label>
        <select class="form-input" id="loginName">
          <option value="">이름 선택</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doLogin()">✅ 로그인</button>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="screen-main">
    <!-- 상태 패널 -->
    <div class="status-panel" id="statusPanel">
      <div class="status-emoji" id="statusEmoji">👤</div>
      <div class="status-name" id="statusName">—</div>
      <div class="status-branch" id="statusBranch">—</div>
      <div id="statusBadge"></div>
      <div class="time-row">
        <div class="time-item">
          <div class="time-label">출근</div>
          <div class="time-val" id="dispClockIn">—</div>
        </div>
        <div class="time-item">
          <div class="time-label">퇴근</div>
          <div class="time-val" id="dispClockOut">—</div>
        </div>
        <div class="time-item">
          <div class="time-label">근무</div>
          <div class="time-val" id="dispHours">—</div>
        </div>
      </div>
    </div>

    <!-- 시계 -->
    <div class="card">
      <div class="live-clock" id="mainClock">00:00:00</div>
      <div class="live-date-str" id="mainDateStr"></div>
      <button class="btn-primary" id="btnClockIn" onclick="doClock('in')">
        🏃 출근 체크인
      </button>
      <button class="btn-primary out" id="btnClockOut" onclick="doClock('out')" style="margin-top:10px;">
        🏠 퇴근 체크아웃
      </button>
      <button class="btn-secondary" onclick="doLogout()">다른 직원으로 전환</button>
    </div>

    <!-- 최근 이력 -->
    <div class="card">
      <div class="card-title">최근 근태 기록</div>
      <div id="histList"><div style="color:#aaa;font-size:13px;text-align:center;padding:20px 0;">기록이 없습니다.</div></div>
    </div>
  </div>
</div>

<div class="toast" id="pwaToast"></div>

<script>
/* ════════════════════════════════════════
   세없결 직원 출퇴근 — Supabase 연동
════════════════════════════════════════ */
const _SB_URL = 'https://yemxddkzgqzmmicnfakl.supabase.co';
const _SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllbXhkZGt6Z3F6bW1pY25mYWtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNjUyNTAsImV4cCI6MjA5Nzk0MTI1MH0.tqTJQOIPKSNm17Braej1aFQodC6nlflGZn78poZakrQ';
const db = supabase.createClient(_SB_URL, _SB_KEY);

let _currentStaff = null; // { id, name, branch, branchId, role }
let _clockTimer   = null;
let _staffList    = [];   // 현재 지점 직원 캐시

let _currentStaff = null;
let _clockTimer   = null;

/* ── 초기화 ── */
async function init() {
  updateClock();
  _clockTimer = setInterval(updateClock, 1000);
  await loadBranches();
  const saved = localStorage.getItem('pwa_current_staff');
  if (saved) {
    try {
      _currentStaff = JSON.parse(saved);
      showMain();
    } catch(e) { showLogin(); }
  } else {
    showLogin();
  }
}

async function loadBranches() {
  const branchEl = document.getElementById('loginBranch');
  const { data, error } = await db.from('branches').select('id, name, region').eq('is_active', true).order('name');
  if (error || !data?.length) return; // fallback: 기존 하드코딩 옵션 유지
  branchEl.innerHTML = data.map(b => `<option value="${b.id}" data-name="${b.name}">${b.name}</option>`).join('');
  branchEl.addEventListener('change', () => {
    const opt = branchEl.options[branchEl.selectedIndex];
    loadStaffForBranch(branchEl.value, opt.dataset.name);
  });
  const firstOpt = branchEl.options[0];
  await loadStaffForBranch(branchEl.value, firstOpt?.dataset.name || firstOpt?.text);
}

async function loadStaffForBranch(branchId, branchName) {
  const nameEl = document.getElementById('loginName');
  if (!branchId) { nameEl.innerHTML = '<option value="">이름 선택</option>'; return; }
  const { data } = await db.from('staff').select('id, name, role').eq('branch_id', branchId).eq('is_active', true).order('name');
  _staffList = (data || []).map(s => ({ id: s.id, name: s.name, branch: branchName || '', branchId, role: s.role || '디자이너' }));
  nameEl.innerHTML = '<option value="">이름 선택</option>' + _staffList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
}

function updateClock() {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  const ss  = String(now.getSeconds()).padStart(2,'0');
  const timeStr = `${hh}:${mm}:${ss}`;
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][now.getDay()]})`;
  ['loginClock','mainClock'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=timeStr; });
  ['loginDateStr','mainDateStr'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent=dateStr; });
  document.getElementById('headerDate').textContent = dateStr;
  if (_currentStaff) updateHoursDisplay();
}

function getToday() {
  return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
}
function nowIso() { return new Date().toISOString(); }
function fmtTime(isoStr) {
  if (!isoStr) return '—';
  const d = new Date(isoStr);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ── 로그인/로그아웃 ── */
function doLogin() {
  const nameEl = document.getElementById('loginName');
  const staffId = nameEl.value;
  if (!staffId) { showToast('직원을 선택해주세요.'); return; }
  const staff = _staffList.find(s => s.id === staffId);
  if (!staff) { showToast('직원 정보를 찾을 수 없습니다.'); return; }
  _currentStaff = staff;
  localStorage.setItem('pwa_current_staff', JSON.stringify(staff));
  showMain();
}
function doLogout() {
  _currentStaff = null;
  localStorage.removeItem('pwa_current_staff');
  showLogin();
}
function showLogin() {
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('screen-main').classList.remove('active');
}
function showMain() {
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  document.getElementById('statusName').textContent   = _currentStaff.name;
  document.getElementById('statusBranch').textContent = _currentStaff.branch + ' · ' + (_currentStaff.role || '디자이너');
  document.getElementById('statusEmoji').textContent  = '👤';
  updateMainButtons(); // async — updates buttons after DB check
  renderHistory();     // async — loads history from DB
}

/* ── 출퇴근 (Supabase) ── */
async function _getTodayRecord() {
  if (!_currentStaff) return null;
  const { data } = await db.from('attendance')
    .select('*').eq('staff_id', _currentStaff.id).eq('date', getToday()).maybeSingle();
  return data || null;
}

async function doClock(type) {
  if (!_currentStaff) return;
  const today = getToday();
  const nowTs = nowIso();
  const rec   = await _getTodayRecord();

  if (type === 'in') {
    if (rec) { showToast('오늘 출근이 이미 기록되어 있습니다.'); return; }
    const { error } = await db.from('attendance').insert({
      staff_id:  _currentStaff.id,
      branch_id: _currentStaff.branchId || null,
      date:      today,
      clock_in:  nowTs
    });
    if (error) { showToast('오류가 발생했습니다.'); console.error(error); return; }
    showToast(`✅ 출근 처리 완료 (${fmtTime(nowTs)})`);
  } else {
    if (!rec) { showToast('출근 기록이 없습니다. 먼저 출근 체크인하세요.'); return; }
    if (rec.clock_out) { showToast('이미 퇴근 처리되었습니다.'); return; }
    const { error } = await db.from('attendance').update({ clock_out: nowTs }).eq('id', rec.id);
    if (error) { showToast('오류가 발생했습니다.'); console.error(error); return; }
    showToast(`🏠 퇴근 처리 완료 (${fmtTime(nowTs)})`);
  }
  await updateMainButtons();
  await renderHistory();
}

async function updateMainButtons() {
  const rec   = await _getTodayRecord();
  const btnIn  = document.getElementById('btnClockIn');
  const btnOut = document.getElementById('btnClockOut');
  const badge  = document.getElementById('statusBadge');
  if (!rec) {
    btnIn.className  = 'btn-primary';
    btnIn.setAttribute('onclick', "doClock('in')");
    btnOut.className = 'btn-primary out disabled';
    btnOut.setAttribute('onclick', '');
    badge.innerHTML = '<span class="status-badge none">⭕ 미출근</span>';
    document.getElementById('dispClockIn').textContent  = '—';
    document.getElementById('dispClockOut').textContent = '—';
    document.getElementById('dispHours').textContent    = '—';
  } else if (!rec.clock_out) {
    btnIn.className  = 'btn-primary disabled';
    btnIn.setAttribute('onclick', '');
    btnOut.className = 'btn-primary out';
    btnOut.setAttribute('onclick', "doClock('out')");
    badge.innerHTML = '<span class="status-badge in">🟢 근무중</span>';
    document.getElementById('dispClockIn').textContent  = fmtTime(rec.clock_in);
    document.getElementById('dispClockOut').textContent = '—';
    _updateHoursEl(rec);
  } else {
    btnIn.className  = 'btn-primary disabled';
    btnIn.setAttribute('onclick', '');
    btnOut.className = 'btn-primary out disabled';
    btnOut.setAttribute('onclick', '');
    badge.innerHTML = '<span class="status-badge out">✅ 퇴근완료</span>';
    document.getElementById('dispClockIn').textContent  = fmtTime(rec.clock_in);
    document.getElementById('dispClockOut').textContent = fmtTime(rec.clock_out);
    _updateHoursEl(rec);
  }
}

function _updateHoursEl(rec) {
  const el = document.getElementById('dispHours');
  if (!rec?.clock_in) { el.textContent = '—'; return; }
  const start = new Date(rec.clock_in);
  const end   = rec.clock_out ? new Date(rec.clock_out) : new Date();
  const diff  = Math.floor((end - start) / 60000);
  if (diff < 0) { el.textContent = '—'; return; }
  el.textContent = `${Math.floor(diff/60)}h${diff%60}m`;
}

function updateHoursDisplay() { /* async 버전(_updateHoursEl)으로 대체됨 */ }

async function renderHistory() {
  const el = document.getElementById('histList');
  if (!_currentStaff) return;
  const { data } = await db.from('attendance')
    .select('*').eq('staff_id', _currentStaff.id)
    .order('date', { ascending: false }).limit(10);
  const recs = data || [];
  if (!recs.length) { el.innerHTML = '<div style="color:#aaa;font-size:13px;text-align:center;padding:16px 0;">기록이 없습니다.</div>'; return; }
  el.innerHTML = recs.map(a => {
    const ciStr = fmtTime(a.clock_in);
    const coStr = a.clock_out ? fmtTime(a.clock_out) : '근무중';
    let hours = '—';
    if (a.clock_in && a.clock_out) {
      const diff = Math.floor((new Date(a.clock_out) - new Date(a.clock_in)) / 60000);
      if (diff >= 0) hours = `${Math.floor(diff/60)}h ${diff%60}m`;
    }
    return `<div class="hist-item">
      <div>
        <div class="hist-date">${a.date}</div>
        <div class="hist-times">${ciStr} ~ ${coStr}</div>
      </div>
      <div class="hist-hours">${hours}</div>
    </div>`;
  }).join('');
}

/* ── 토스트 ── */
let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('pwaToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ── 시작 ── */
init();
</script>
</body>
</html>
